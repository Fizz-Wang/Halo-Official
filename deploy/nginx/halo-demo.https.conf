server {
    listen 80;
    listen [::]:80;
    server_name halo-demo.qichenggroup.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name halo-demo.qichenggroup.top;

    ssl_certificate /etc/letsencrypt/live/halo-demo.qichenggroup.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/halo-demo.qichenggroup.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:halo_demo_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_ecdh_curve X25519:secp384r1;
    ssl_prefer_server_ciphers off;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:14080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
